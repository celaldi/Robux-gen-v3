name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Build with Buildozer
        uses: ArtemGr/buildozer-action@v1
        with:
          command: buildozer android debug
          repository_display_name: 'Robux Generator v3.1'
          
